# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: pip  # keyed on requirements.txt (v5: v3's cache toolkit is retired)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # the CPU-only torch wheel first (no CUDA wheels to download); requirements.txt's unpinned torch accepts it
        pip install --index-url https://download.pytorch.org/whl/cpu torch
        pip install flake8 pytest pytest-xdist
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        python -c "import torch; print('torch', torch.__version__)"
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        # MPS tests and frozen Mac float digests need this Mac: Linux CI deselects them (they run locally, see
        # pytest.ini). 4 xdist workers (explicit: -n auto counts physical cores), worksteal balances the long tests.
        # A background sampler keeps the peak of free's "Mem: used" (MiB) while pytest runs. Each sample replaces the
        # file by a rename (never half written); a missing or unreadable peak never changes the step's exit status.
        peak_file="$RUNNER_TEMP/mem_peak"
        echo "0 0" > "$peak_file"
        ( peak=0; k=0; while true; do u=$(free -m | awk '/^Mem:/ {print $3}'); k=$((k + 1))
          [ "$u" -gt "$peak" ] && peak=$u; echo "$peak $k" > "$peak_file.new" && mv -f "$peak_file.new" "$peak_file"
          sleep 5; done ) &
        sampler=$!
        rc=0
        cd MahjongAI/tests/; pytest -n 4 --dist worksteal --durations=25 -m "not mps and not mac_floats" || rc=$?
        kill $sampler; wait $sampler 2>/dev/null || true
        peak=unknown; k=0
        read -r peak k < "$peak_file" || true
        echo "peak used memory ${peak:-unknown} MiB (samples ${k:-0})"
        exit $rc
