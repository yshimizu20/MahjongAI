# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        # the Linux CPU wheel of the pinned torch (T-050: torch.compile tests), before requirements.txt pins it
        pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Show the torch build and the compiler toolchain
      run: |
        python -c "import torch; print(torch.__version__); print(torch.__config__.show())"
        gcc --version
        printf '#include <omp.h>\n#include <stdio.h>\nint main(){printf("OpenMP %%d threads\\n", omp_get_max_threads());return 0;}\n' > omp_check.c
        gcc -fopenmp omp_check.c -o omp_check && ./omp_check
        rm -f omp_check.c omp_check
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        # -rs: the reason of any skip; conftest.py fails the run on a skip
        cd MahjongAI/tests/; pytest -rs
