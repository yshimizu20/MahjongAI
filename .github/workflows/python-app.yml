# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: pip  # keyed on requirements.txt (v5: v3's cache toolkit is retired)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # the CPU-only wheel of requirements.txt's pinned torch first (no CUDA wheels to download): 2.13.0+cpu meets the
        # pin torch==2.13.0 (a specifier without a local label ignores it), so the requirements step keeps it (T-065)
        torch_version=$(sed -n 's/^torch==\([^ ]*\).*/\1/p' requirements.txt)
        [ -n "$torch_version" ] || { echo "no torch==<version> pin in requirements.txt"; exit 1; }
        pip install --index-url https://download.pytorch.org/whl/cpu "torch==$torch_version"
        # xdist pinned: conftest places the self-test parts by 3.8.0 worksteal's first split (worksteal_starts)
        pip install flake8 pytest pytest-xdist==3.8.0
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        python -c "import torch; print('torch', torch.__version__)"
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        # MPS tests and frozen Mac float digests need this Mac: Linux CI deselects them (they run locally, see
        # pytest.ini). 4 xdist workers (explicit: -n auto counts physical cores), worksteal balances the long tests.
        # A background sampler keeps the peak of free's "Mem: used" (MiB) while pytest runs. Each sample replaces the
        # file by a rename (never half written); a missing or unreadable peak never changes the step's exit status.
        # The busy share of all CPUs over pytest (T-065: CI time is taken as CPU work / vCPUs) comes from /proc/stat's
        # "cpu" line before and after: (user nice system irq softirq steal) / (those + idle iowait); unreadable -> unknown.
        cpu_ticks() { awk '/^cpu / {print $2+$3+$4+$7+$8+$9, $5+$6; exit}' /proc/stat 2>/dev/null || true; }
        read -r busy0 idle0 <<< "$(cpu_ticks)" || true
        t0=$(date +%s)
        peak_file="$RUNNER_TEMP/mem_peak"
        echo "0 0" > "$peak_file"
        ( peak=0; k=0; while true; do u=$(free -m | awk '/^Mem:/ {print $3}'); k=$((k + 1))
          [ "$u" -gt "$peak" ] && peak=$u; echo "$peak $k" > "$peak_file.new" && mv -f "$peak_file.new" "$peak_file"
          sleep 5; done ) &
        sampler=$!
        rc=0
        cd MahjongAI/tests/; pytest -n 4 --dist worksteal --durations=25 -m "not mps and not mac_floats" || rc=$?
        kill $sampler; wait $sampler 2>/dev/null || true
        read -r busy1 idle1 <<< "$(cpu_ticks)" || true
        awk -v b0="$busy0" -v i0="$idle0" -v b1="$busy1" -v i1="$idle1" -v s=$(( $(date +%s) - t0 )) -v n="$(nproc)" \
          'BEGIN { d = (b1 - b0) + (i1 - i0); if (b0 == "" || b1 == "" || d <= 0) print "cpu busy unknown";
                   else printf "cpu busy %.1f %% of %d vCPU over %d s\n", 100 * (b1 - b0) / d, n, s }' || true
        peak=unknown; k=0
        read -r peak k < "$peak_file" || true
        echo "peak used memory ${peak:-unknown} MiB (samples ${k:-0})"
        exit $rc
