[pytest]
# Found from the repo root and from `cd MahjongAI/tests` (CI) alike: the repo root goes on sys.path for
# `import MahjongAI`, and collection stays out of the 43 GB data/ tree and the ignored task/ folder.
testpaths = MahjongAI/tests
pythonpath = .
# mps: needs this machine's GPU (MPS). Locally they run and must pass (a skip is a fail); Linux CI deselects them.
markers =
    mps: needs the Apple GPU (MPS); Linux CI runs pytest -m "not mps"
