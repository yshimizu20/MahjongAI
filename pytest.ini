[pytest]
# Found from the repo root and from `cd MahjongAI/tests` (CI) alike: the repo root goes on sys.path for
# `import MahjongAI`, and collection stays out of the 43 GB data/ tree and the ignored task/ folder.
testpaths = MahjongAI/tests
pythonpath = .
# mps / mac_floats: need this machine (its GPU / its float results). Locally they run and must pass (a skip is a
# fail); Linux CI deselects them.
markers =
    mps: needs the Apple GPU (MPS); Linux CI runs pytest -m "not mps and not mac_floats"
    mac_floats: frozen digests of this Mac's CPU float results (another BLAS gives other bits)
