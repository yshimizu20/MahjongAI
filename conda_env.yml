name: mahjong
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pytorch
  - numpy
  - jupyter
  - ipykernel
  - pip
  - pip:
      - mahjong==1.4.0  # 2.x breaks utils/agari.py and utils/win_oracles.py; port = T-036
      - requests
      - pytest>=7  # pytest.ini uses the pythonpath key (7.0+)
